<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b7a53" />
  <title>غير متصل | طريق الشام</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:#17362d;font-family:Arial,sans-serif}.page{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.card{width:min(100%,520px);padding:30px 22px;border:1px solid #dfe7e3;border-radius:22px;background:#fff;text-align:center;box-shadow:0 12px 34px rgba(15,59,45,.08)}.mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:#0b7a53;color:#fff;font-size:30px;font-weight:800}.card h1{margin:0 0 10px;font-size:25px}.card p{margin:0;line-height:1.9;color:#5c6f68}.button{margin-top:22px;min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#0b7a53;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="mark">ش</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يحتاج عرض الحجوزات والموقع المباشر إلى اتصال بالشبكة. أعد المحاولة بعد عودة الاتصال.</p>
      <button class="button" onclick="location.reload()">إعادة المحاولة</button>
    </section>
  </main>
</body>
</html>
