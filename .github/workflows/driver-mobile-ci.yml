name: Driver Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/driver-mobile/**"
      - ".github/workflows/driver-mobile-ci.yml"
  push:
    branches: ["agent/driver-mobile-foundation"]
    paths:
      - "apps/driver-mobile/**"
      - ".github/workflows/driver-mobile-ci.yml"

concurrency:
  group: driver-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/driver-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android and iOS platform projects
        run: flutter create --platforms=android,ios --project-name ride_driver --org com.rideplatform --no-pub .

      - name: Configure background location permissions
        run: python3 tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://ride-platform-starter.onrender.com/api
          --dart-define=FIREBASE_API_KEY=${{ secrets.DRIVER_FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.DRIVER_FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.DRIVER_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.DRIVER_FIREBASE_PROJECT_ID }}

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ride-platform-driver-android-${{ github.run_number }}
          path: apps/driver-mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
