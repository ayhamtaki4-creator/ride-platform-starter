name: Driver Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/driver-mobile/**"
      - ".github/workflows/driver-mobile-ci.yml"
  push:
    branches: ["agent/driver-mobile-foundation"]
    paths:
      - "apps/driver-mobile/**"
      - ".github/workflows/driver-mobile-ci.yml"

concurrency:
  group: driver-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/driver-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
