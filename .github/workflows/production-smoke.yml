name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    name: public production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_API_URL: https://ride-platform-starter.onrender.com/api
      PRODUCTION_PORTAL_URL: ${{ vars.PRODUCTION_PORTAL_URL || 'https://tareeqalsham.com' }}
      PRODUCTION_SMOKE_TIMEOUT_MS: "120000"
      PRODUCTION_SMOKE_MAX_ATTEMPTS: "2"
      PRODUCTION_SMOKE_RETRY_DELAY_MS: "10000"
      PRODUCTION_SMOKE_SLOW_MS: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production after main deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Production smoke attempt ${attempt}/5"
            if node scripts/production-smoke.mjs; then
              exit 0
            fi

            if [ "${attempt}" -lt 5 ]; then
              echo "Production may still be converging; retrying after 40 seconds."
              sleep 40
            fi
          done

          exit 1

      - name: Verify current production health
        if: github.event_name != 'push'
        run: node scripts/production-smoke.mjs

      # Scheduled failures open ONE GitHub incident rather than creating an
      # issue for each six-hour check. The next healthy run closes it.
      # This uses the ephemeral Actions token, never a production credential.
      - name: Track scheduled production incident
        if: always() && github.event_name == 'schedule' && (job.status == 'success' || job.status == 'failure')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_STATUS: ${{ job.status }}
        run: node scripts/production-smoke-issue.mjs
