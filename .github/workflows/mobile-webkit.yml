name: Mobile WebKit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

concurrency:
  group: mobile-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_SKIP_WEBSERVER: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Start portal
        run: |
          nohup pnpm --filter portal dev --hostname 127.0.0.1 >/tmp/portal-webkit.log 2>&1 &
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portal-webkit.log
          exit 1

      - name: Run iPhone WebKit smoke tests
        run: pnpm exec playwright test e2e/tests/mobile-ios-public.spec.ts --project=webkit-mobile

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
