name: Mobile E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride_password
          POSTGRES_DB: ride_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride -d ride_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ride:ride_password@127.0.0.1:5432/ride_platform?schema=public
      DIRECT_URL: postgresql://ride:ride_password@127.0.0.1:5432/ride_platform?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: mobile-e2e-jwt-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      SERVICE_TIME_ZONE: Asia/Damascus
      AUTH_REFRESH_COOKIE_ENABLED: "false"
      PORT: 4100
      WEB_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3100
      TRUST_PROXY_HOPS: "0"
      AUTH_RATE_LIMIT_ENABLED: "true"
      AUTH_LOGIN_IDENTITY_MAX: "3"
      AUTH_LOGIN_IP_MAX: "120"
      AUTH_LOGIN_WINDOW_SECONDS: "900"
      GPS_SERVER_MIN_INTERVAL_MS: "1500"
      MAP_PROVIDER: mapbox
      MAPBOX_ACCESS_TOKEN: mobile-e2e-mapbox-token
      MAPBOX_GEOCODING_BASE_URL: http://127.0.0.1:4199/geocode
      MAPBOX_DIRECTIONS_BASE_URL: http://127.0.0.1:4199/directions
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_PUBLIC_KEY: BOeEgIs4pVqcHNpQbKpvtzbDQzphJo9Udx5-iU_Ujk4CDLMcuksk3NedDYSF6t0iCdnLySBRTLYmD1vEtxwNw6M
      WEB_PUSH_PRIVATE_KEY: xhXrlGhmyD8W-icr3_rBeuruXL96R-j0nMDs_EIBmUw
      WEB_PUSH_SUBJECT: mailto:mobile-e2e@example.com
      PUBLIC_API_URL: http://127.0.0.1:4100
      PORTAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api
      MEDIA_STORAGE_ROOT: ./storage/media-e2e
      TELEGRAM_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:4100/api
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start maps upstream stub
        run: |
          nohup node e2e/helpers/maps-upstream-stub.mjs >/tmp/maps-upstream.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4199/health >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/maps-upstream.log
          exit 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter api run prisma:deploy

      - name: Seed E2E data
        run: pnpm db:seed

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mobile, performance, network, booking, dispatch, finance, contact, fleet, health, PWA, auth, maps, push, and security Playwright suites
        run: pnpm exec playwright test e2e/tests/mobile-shell.spec.ts e2e/tests/mobile-performance.spec.ts e2e/tests/api-network-resilience.spec.ts e2e/tests/pwa-seo.spec.ts e2e/tests/health.spec.ts e2e/tests/auth-rate-limit.spec.ts e2e/tests/auth-refresh-legacy.spec.ts e2e/tests/booking-auth-gate.spec.ts e2e/tests/private-car-public.spec.ts e2e/tests/mobile-ticket-upload.spec.ts e2e/tests/web-push.spec.ts e2e/tests/booking-location.spec.ts e2e/tests/booking-template-endpoint-regression.spec.ts e2e/tests/booking-route-plan-enrichment.spec.ts e2e/tests/booking-modification.spec.ts e2e/tests/gps-server-throttle.spec.ts e2e/tests/r2-presigned-url.spec.ts e2e/tests/vehicle-image-variants.spec.ts e2e/tests/public-ticket-analysis.spec.ts e2e/tests/rider-booking-details.spec.ts e2e/tests/driver-round-trip-day.spec.ts e2e/tests/driver-financial-settlements.spec.ts e2e/tests/assigned-driver-contact.spec.ts e2e/tests/vehicle-primary-image.spec.ts e2e/tests/maps-api.spec.ts --project=chromium

      - name: Build production portal for critical CSS guard
        run: pnpm --filter portal build

      - name: Start production portal
        run: |
          PORT=3100 nohup pnpm --filter portal start >/tmp/portal-production.log 2>&1 &
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:3100/login >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/portal-production.log
          exit 1

      - name: Verify production critical CSS boundary
        env:
          E2E_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: http://127.0.0.1:3100
        run: pnpm exec playwright test e2e/tests/mobile-performance-production.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  refresh-cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride_password
          POSTGRES_DB: ride_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride -d ride_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ride:ride_password@127.0.0.1:5432/ride_platform?schema=public
      DIRECT_URL: postgresql://ride:ride_password@127.0.0.1:5432/ride_platform?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: refresh-cookie-e2e-jwt-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      SERVICE_TIME_ZONE: Asia/Damascus
      AUTH_REFRESH_COOKIE_ENABLED: "true"
      AUTH_REFRESH_COOKIE_SECURE: "false"
      AUTH_REFRESH_COOKIE_SAME_SITE: "lax"
      AUTH_RATE_LIMIT_ENABLED: "false"
      PORT: 4100
      WEB_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      TRUST_PROXY_HOPS: "0"
      PUBLIC_API_URL: http://127.0.0.1:4100
      PORTAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/api
      MEDIA_STORAGE_ROOT: ./storage/media-cookie-e2e
      TELEGRAM_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:4100/api
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter api run prisma:deploy

      - name: Seed E2E data
        run: pnpm db:seed

      - name: Run HttpOnly refresh-cookie Playwright suite
        run: pnpm exec playwright test e2e/tests/auth-refresh-cookie.spec.ts --project=chromium
