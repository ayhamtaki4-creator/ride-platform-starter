name: GA4 Live Diagnostic

on:
  push:
    branches:
      - agent/ga4-live-diagnostic-20261014

permissions:
  contents: read

jobs:
  ga4-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Diagnose live analytics after visitor consent
        run: node scripts/ga4-live-diagnostic.mjs
